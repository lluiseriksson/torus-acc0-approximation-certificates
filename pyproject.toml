[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torus-acc0-approximation-certificates"
version = "1.0.0"
description = "Machine-checked Lean 4 & exact-Q prime-power finite-difference, Fourier-rounding, CRT, and NMQC periodic-Fourier certificates for low-degree torus approximations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Lluis Eriksson"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
